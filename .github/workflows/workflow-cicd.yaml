name: Intégration continue
# Déclenchement auto
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      security-events: write # pour la mise à jour de l'onglet Security and quality
      contents: read # lire le code source

    steps:
      # checkout et setup-java
      - name: Récupérer le code
        uses: actions/checkout@v5

      - name: Configurer JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Initialiser CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Construire avec Maven
        run: mvn -B clean verify

      - name: Analyser avec CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          output: sarif-results

      - name: Publier le rapport
        uses: actions/upload-artifact@v7
        with:
          name: rapport-codeql
          path: sarif-results

      # Java Code Coverage
      - name: Publier le rapport JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-jacoco
          path: target/site/jacoco

      # Checkstyle
      - name: Générer le rapport Checkstyle
        run: mvn site
        # ``run: mvn -B checkstyle:checkstyle`` est plus rapide
        # mais ne génère que checkstyle-result.xml

      - name: Publier le rapport Checkstyle
        uses: actions/upload-artifact@v7
        with:
          name: rapport-checkstyle
          path: target/site